#:schema node_modules/wrangler/config-schema.json
name = "portofolio"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "portofolio"

# Note: Set environment variables and secrets via Cloudflare Dashboard or `wrangler secret put`
# [vars] section is left out so wrangler deploy doesn't overwrite remote Dashboard settings.

# Bindings (KV, D1, etc. can go here)
